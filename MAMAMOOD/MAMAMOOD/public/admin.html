<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAMAMOOD Admin</title><style>body{font-family:Arial;background:#f7f8fc;padding:24px}input,button{padding:12px;margin:4px}table{width:100%;border-collapse:collapse;background:#fff}td,th{border:1px solid #ddd;padding:7px;vertical-align:top}pre{white-space:pre-wrap}</style><h1>MAMAMOOD Admin</h1><section id="login"><input id="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button id="go">Войти</button></section><section id="panel" hidden><button id="out">Выйти</button><table><thead><tr><th>Дата</th><th>Возраст</th><th>Статус</th><th>Баллы</th><th>Q10</th><th>Ответы</th></tr></thead><tbody id="rows"></tbody></table></section><script>let sb;async function init(){let c=await fetch('/api/config').then(r=>r.json()),m=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');sb=m.createClient(c.supabaseUrl,c.supabaseAnonKey);go.onclick=async()=>{let r=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(r.error)alert(r.error.message);else load()};out.onclick=()=>sb.auth.signOut();async function load(){login.hidden=true;panel.hidden=false;let r=await sb.from('test_results').select('*').order('created_at',{ascending:false});if(r.error)return alert(r.error.message);rows.innerHTML=r.data.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${x.age??''}</td><td>${x.status}</td><td>${x.score}</td><td>${x.self_harm_positive?'Да':'Нет'}</td><td><pre>${JSON.stringify(x.answers,null,2)}</pre></td></tr>`).join('')}}init()</script></html>
